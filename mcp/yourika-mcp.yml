method: searched
status: published
source: https://www.yourikalabs.com/llms.txt
notes: YOURIKA Labs publishes a Wix Site MCP endpoint (the generic Model Context Protocol server Wix exposes
  for every site) advertised in its /llms.txt. It is not a bespoke YOURIKA API — it surfaces public site
  content plus the Wix business-solutions installed on the site. No authentication is required to connect;
  only public information is accessible.
server:
  name: yourika-labs-site
  provider: Wix Site MCP
  transport: http
  url: https://www.yourikalabs.com/_api/mcp
  auth_required: false
  docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, and address.
- name: SearchInSite
  description: Searches the site for information.
  parameters:
  - name: searchTerm
    description: The term to search for in the site.
- name: SearchSiteApiDocs
  description: Retrieves the API documentation for the Wix business solutions installed on this site and
    informs the AI client how to use the APIs. Use for querying products and services (instead of SearchInSite).
  parameters:
  - name: searchTerm
    description: The term to search for in the site API documentation.
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the site. Must be
    called before any CallWixSiteAPI request if no visitor token is already available.
- name: CallWixSiteAPI
  description: Calls API methods on the site to perform actions on a visitor's behalf, such as querying
    site data, booking an appointment, or starting a purchase.
  parameters:
  - name: visitorToken
    description: Visitor access token. Use GenerateVisitorToken first if not available.
  - name: url
    description: Absolute URL of the API method to call (e.g. https://www.wixapis.com/...). Retrieve using
      SearchSiteApiDocs.
  - name: method
    description: HTTP method to use for the API call.
  - name: body
    description: Request body as a valid JSON string.
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  parameters:
  - name: articleUrl
    description: URL of an article in the Wix developer documentation portal.
- name: ReadFullDocsMethodSchema
  description: Fetches the full schema for a Wix API method. Should be called before calling the actual
    method via CallWixSiteAPI.
  parameters:
  - name: articleUrl
    description: URL of the reference article for the Wix API method.
capabilities:
- Get business details (contact info, location, hours)
- Discover products and services on offer
- Book services and make reservations
- Start a purchase and be directed to the site to complete checkout
- Ask questions and get relevant answers without browsing the site
deployment:
  mode: remote
  endpoint: https://www.yourikalabs.com/_api/mcp
  verified: probed
  probe: live
  tools: 9
  checked: '2026-08-12'
