name: YOURIKA
description: >-
  YOURIKA (YOURIKA Labs) is a Kitchener-Waterloo, Canada AI platform and venture
  studio that creates and scales purpose-built, verticalized AI ventures in
  partnership with industry experts, prioritizing accuracy, trust, and measurable
  outcomes over technology-first approaches. Its ventures include smart'n, a
  nurse-first intelligence and learning platform that helps nurses learn, grow,
  and make more informed decisions throughout their careers, and Retain /
  Workforce Intelligence for senior and long-term care, which helps operators
  identify, hire, and retain caregivers while reducing turnover. yourikaLABS also
  offers AI advisory services connecting businesses with experts to build
  data-driven strategies and roadmaps. YOURIKA is backed by Amazon, Techstars
  (Amazon Alexa Accelerator), and the University of Waterloo. The company exposes
  no bespoke public developer API; its marketing site is built on Wix and
  advertises a Wix Site MCP endpoint plus an llms.txt for agentic access.
